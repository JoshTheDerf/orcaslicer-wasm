name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write   # tag pushes publish a release

jobs:
  orca:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential m4 xz-utils unzip curl git python3 ccache

      # Toolchain (emsdk, CMake, Ninja) and the dependency prefix, keyed on the scripts that make them.
      - name: Cache toolchain
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            toolchain/emsdk
            toolchain/cmake
            toolchain/tools
          key: tools-${{ runner.os }}-${{ hashFiles('toolchain/bootstrap.sh') }}
      - name: Bootstrap toolchain
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash toolchain/bootstrap.sh

      - name: Cache dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            toolchain/install
            toolchain/cgal-5.6.3
            toolchain/cgal-6.1
          key: deps-${{ runner.os }}-${{ hashFiles('toolchain/build-deps.sh', 'toolchain/env.sh', 'toolchain/bootstrap.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: NPROC=4 bash toolchain/build-deps.sh all && NPROC=4 bash toolchain/build-deps.sh preflight-extras

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: toolchain/ccache-cache
          key: ccache-orca-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-orca-${{ runner.os }}-

      - name: Build engine
        run: NPROC=4 bash scripts/build-wasm.sh

      - name: Test
        run: |
          node tests/cs-slice-test.mjs build-wasm
          node tests/cs-tool-test.mjs build-wasm

      - name: Package
        run: |
          mkdir -p dist
          cp build-wasm/slicer.mjs build-wasm/slicer.wasm build-wasm/schema.json build-wasm/version.json dist/
          [ -f build-wasm/slicer.data ] && cp build-wasm/slicer.data dist/ || true
          tar -C orca/resources -czf dist/profiles.tar.gz profiles
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: orca-wasm-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  fullspectrum:
    needs: orca   # reuses the toolchain / dependency caches the orca job saved
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential m4 xz-utils unzip curl git python3 ccache
      - uses: actions/cache/restore@v4
        with:
          path: |
            toolchain/emsdk
            toolchain/cmake
            toolchain/tools
          key: tools-${{ runner.os }}-${{ hashFiles('toolchain/bootstrap.sh') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            toolchain/install
            toolchain/cgal-5.6.3
            toolchain/cgal-6.1
          key: deps-${{ runner.os }}-${{ hashFiles('toolchain/build-deps.sh', 'toolchain/env.sh', 'toolchain/bootstrap.sh') }}
          fail-on-cache-miss: true
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: toolchain/ccache-cache
          key: ccache-fs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-fs-${{ runner.os }}-

      - name: Build engine
        run: NPROC=4 bash scripts/build-fullspectrum.sh

      - name: Test
        run: node tests/cs-fs-test.mjs build-fs

      - name: Package
        run: |
          mkdir -p dist
          cp build-fs/slicer.mjs build-fs/slicer.wasm build-fs/schema.json build-fs/version.json dist/
          [ -f build-fs/slicer.data ] && cp build-fs/slicer.data dist/ || true
          tar -C fullspectrum/resources -czf dist/profiles.tar.gz profiles
      - uses: actions/upload-artifact@v4
        with:
          name: fullspectrum-wasm-${{ github.sha }}
          path: dist/
          retention-days: 30
